<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Change a mood. Catch a reaction. Let the character tell the story."><title>Expressive mascot · Su UI lab</title><script src="../shared/setup.js"></script><link rel="stylesheet" href="../shared/lab.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main><nav><a href="/lab">← UI lab</a><span>03 / Expressive mascot</span></nav><header class="page-heading"><h1>Expressive mascot</h1><p class="intro">Change a mood. Catch a reaction. Let the character tell the story.</p><p class="note">From Kaifan · A little character with a little personality</p></header><div class="mascot-stage"><div class="kaifan-mascot" id="mascot" data-mood="idle" aria-hidden="true"><svg viewBox="0 0 160 160" role="presentation" focusable="false">
        <defs>
          <clipPath id="mascot-face">
            <circle cx="80" cy="80" r="62" />
          </clipPath>
        </defs>
        <g class="grokdot-character">
          <circle class="grokdot-body" cx="80" cy="80" r="62" />
          <g class="grokdot-face" clip-path="url(#mascot-face)">
            <g class="grokdot-eyes grokdot-eyes-open">
              <rect class="grokdot-eye grokdot-eye-left" x="67" y="55" width="15" height="32" rx="7.5" />
              <rect class="grokdot-eye grokdot-eye-right" x="98" y="55" width="15" height="32" rx="7.5" />
            </g>
            <g class="grokdot-eyes grokdot-eyes-surprised">
              <circle class="grokdot-eye" cx="74.5" cy="70" r="7.5" />
              <circle class="grokdot-eye" cx="105.5" cy="70" r="7.5" />
            </g>
            <g class="grokdot-eyes grokdot-eyes-smile">
              <path class="grokdot-eye-stroke" d="M66.5 73 Q74.5 62 82.5 73" />
              <path class="grokdot-eye-stroke" d="M97.5 73 Q105.5 62 113.5 73" />
            </g>
            <g class="grokdot-eyes grokdot-eyes-wink">
              <path class="grokdot-eye-stroke" d="M66.5 72 Q74.5 63 82.5 72" />
              <rect class="grokdot-eye" x="98" y="55" width="15" height="32" rx="7.5" />
            </g>
            <g class="grokdot-eyes grokdot-eyes-content">
              <path class="grokdot-eye-stroke" d="M66.5 71 Q74.5 65 82.5 71" />
              <path class="grokdot-eye-stroke" d="M97.5 71 Q105.5 65 113.5 71" />
            </g>
          </g>
        </g>
      </svg></div></div><div class="controls" role="group" aria-label="Mood"><span class="control-label">Mood</span><button type="button" data-mood="idle" aria-pressed="true">Idle</button><button type="button" data-mood="thinking" aria-pressed="false">Thinking</button><button type="button" data-mood="happy" aria-pressed="false">Happy</button><button type="button" data-mood="proud" aria-pressed="false">Proud</button><button type="button" data-mood="sleepy" aria-pressed="false">Sleepy</button></div><div class="controls" role="group" aria-label="Short reaction"><span class="control-label">React</span><button type="button" data-reaction="notice">Notice</button><button type="button" data-reaction="consider">Consider</button><button type="button" data-reaction="wink">Wink</button><button type="button" data-reaction="surprised">Surprised</button><button type="button" data-reaction="approve">Approve</button></div><div class="controls"><button type="button" class="primary" id="play">Play sequence</button><button type="button" id="reset">Reset</button></div><p class="status" id="status" role="status">Idle · looking around</p><noscript><p>Enable JavaScript to try this experiment.</p></noscript></main><script src="./script.js"></script></body></html>

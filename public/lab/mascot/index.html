<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Change a mood. Catch a reaction. Let the character tell the story."><title>Expressive mascot · Su UI lab</title><script src="../shared/setup.js"></script><link rel="stylesheet" href="../shared/lab.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main><nav><a href="/lab">← UI lab</a><span>03 / Expressive mascot</span></nav><header class="page-heading"><h1>Expressive mascot</h1><p class="intro">Change a mood. Catch a reaction. Let the character tell the story.</p><p class="note">Small expressions, softly animated</p></header><div class="mascot-stage"><div class="lab-mascot" id="mascot" data-mood="idle" aria-hidden="true"><svg viewBox="0 0 160 160" role="presentation" focusable="false"><g class="character"><circle class="body" cx="80" cy="80" r="62"/><g class="face"><g transform="translate(0 6)"><path id="eye-left" class="eye" d="M64 65 C64 69 64 72 64 76"/><path id="eye-right" class="eye" d="M96 65 C96 69 96 72 96 76"/></g></g></g></svg></div></div><div class="controls" role="group" aria-label="Mood"><span class="control-label">Mood</span><button type="button" data-mood="idle" aria-pressed="true">Idle</button><button type="button" data-mood="thinking" aria-pressed="false">Thinking</button><button type="button" data-mood="happy" aria-pressed="false">Happy</button><button type="button" data-mood="proud" aria-pressed="false">Proud</button><button type="button" data-mood="sleepy" aria-pressed="false">Sleepy</button></div><div class="controls" role="group" aria-label="Short reaction"><span class="control-label">React</span><button type="button" data-reaction="notice">Notice</button><button type="button" data-reaction="consider">Consider</button><button type="button" data-reaction="wink">Wink</button><button type="button" data-reaction="surprised">Surprised</button><button type="button" data-reaction="approve">Approve</button></div><div class="controls"><button type="button" class="primary" id="play">Play sequence</button><button type="button" id="reset">Reset</button></div><p class="status" id="status" role="status">Idle · looking around</p><noscript><p>Enable JavaScript to try this experiment.</p></noscript></main><script src="./script.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A streaming timeline experiment with entirely fictional garden-project data." />
  <title>Streaming timeline · Su UI lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#demo">Skip to timeline</a>
  <main class="page-shell">
    <nav class="lab-nav" aria-label="Breadcrumb"><a href="/lab">← UI lab</a><span>01 / Streaming timeline</span></nav>
    <header class="intro">
      <h1>Streaming timeline</h1>
      <p class="intro-copy">A garden taking shape, one update at a time.</p>
      <p class="sample-note">Fictional data · 24 updates · about 9 seconds</p>
    </header>
    <div class="playback-bar" role="group" aria-label="Playback controls">
      <button class="primary-button" id="replayButton" type="button">Replay changes</button>
      <button class="secondary-button" id="resetButton" type="button">Reset</button>
      <label class="speed-control" for="speedSelect"><span>Speed</span><select id="speedSelect"><option value="1.35">Slow</option><option value="1" selected>Normal</option><option value="0.65">Fast</option></select></label>
    </div>
    <div class="legend" aria-label="Diff legend"><span><i class="legend-swatch is-added"></i>Added</span><span><i class="legend-swatch is-changed"></i>Changed</span><span><i class="legend-swatch is-removed"></i>Removed</span></div>
    <article class="timeline-card" id="demo" aria-labelledby="demo-title">
      <header class="timeline-card-header"><h2 id="demo-title">The shared garden</h2><span class="mode-label" id="modeLabel">Preview</span></header>
      <div class="timeline-list" id="timelineList"></div>
      <noscript><p>This interactive demo needs JavaScript.</p></noscript>
      <footer class="timeline-footer" aria-live="polite"><span class="status-dot" id="statusDot" aria-hidden="true"></span><span id="statusText">Preview ready</span></footer>
    </article>
  </main>
  <script src="./script.js"></script>
</body>
</html>
